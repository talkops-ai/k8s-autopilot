[project]
name = "k8s-autopilot"
version = "0.6.0"
description = "Multi Agents responsible for complete Kubernetes deployment automation (generation → deployment → monitoring)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.1.0",
    "a2ui-agent",
    "colorama>=0.4.6",
    "copilotkit>=0.1.0",
    "deepagents[quickjs]>=0.7.2",
    "langchain>=1.3.2",
    "langchain-anthropic>=1.4.4",
    "langchain-aws>=1.5.0",
    "langchain-baseten>=0.2.4",
    "langchain-cohere>=0.6.0",
    "langchain-core>=1.4.0",
    "langchain-deepseek>=1.1.0",
    "langchain-fireworks>=1.6.1",
    "langchain-google-genai>=4.2.4",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-mistralai>=1.1.6",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "langchain-perplexity>=1.4.1",
    "langchain-together>=0.4.0",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "aiosqlite>=0.22.1",
    "psycopg[binary,pool]>=3.1.0",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "uvicorn>=0.42.0",
    "tavily-python>=0.7.26",
    "markdownify>=1.2.3",
    "filelock>=3.32.3",
    "genai-prices>=0.1.0",
    "langchain-quickjs>=0.3.3",
    "bashlex>=0.18",
]

license = {text = "Apache-2.0"}
license-files = ["LICENSE"]
authors = [
    {name = "talkops"},
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
mcp-servers = [
    "talkops-prometheus-mcp-server==0.1.11",
    "talkops-alertmanager-mcp-server==0.1.2",
    "talkops-helm-mcp-server==0.4.1",
    "talkops-argocd-mcp-server==0.3.4",
    "talkops-argo-rollout-mcp-server==0.1.1",
    "talkops-traefik-mcp-server==0.1.2",
    "talkops-opentelemetry-mcp-server==0.1.11",
    "talkops-loki-mcp-server==0.1.12",
    "talkops-tempo-mcp-server==0.1.5",
]
interpreter = [
    "langchain-quickjs>=0.1.0",
]
slack = [
    "slack-bolt>=1.22.0",
    "slack-sdk>=3.35.0",
]
sandboxes = [
    "langchain-daytona",
    "langchain-modal",
    "langchain-runloop",
    "langchain-vercel-sandbox",
    "langchain-agentcore-codeinterpreter",
]

[project.urls]
homepage = "https://github.com/talkops-ai/k8s-autopilot"
repository = "https://github.com/talkops-ai/k8s-autopilot.git"
documentation = "https://github.com/talkops-ai/k-autopilot/blob/main/README.md"

[project.scripts]
k8s-autopilot = "k8s_autopilot.server.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.9.7",
    "mypy>=1.0.0",
    "ipykernel>=6.29.0",
    "rich>=14.2.0",
    "asyncclick>=8.3.0.7",
    "agentevals>=0.0.9",
    "types-protobuf>=7.35.1.20260827",
    "isort>=9.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["k8s_autopilot"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["k8s_autopilot"]

[tool.ruff.lint]
select = [
    "F",       # Pyflakes — unused imports, undefined names
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "I",       # isort — import ordering
    "D",       # pydocstyle — docstring presence and format
    "UP",      # pyupgrade — modern Python idioms
    "B",       # flake8-bugbear — common bugs
    "SIM",     # flake8-simplify — simplifiable code
    "RUF",     # Ruff-specific rules
]
ignore = [
    "D100",    # Missing module docstring (enable after Phase 3 complete)
    "D104",    # Missing public package docstring
    "D105",    # Missing magic method docstring
    "D107",    # Missing __init__ docstring (enable after Phase 3 complete)
    "D203",    # Conflicts with D211 (no-blank-line-before-class)
    "D213",    # Conflicts with D212 (multi-line-summary-second-line)
    "E501",    # Line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["k8s_autopilot"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]  # Don't require docstrings in tests
"k8s_autopilot/**/__init__.py" = ["D104"]  # Package init files

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["k8s_autopilot"]
src_paths = ["k8s_autopilot"]
force_sort_within_sections = true
combine_as_imports = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: deterministic tests for pure functions, schemas, and node logic",
    "eval: trajectory and semantic evaluation tests",
    "sandbox: ephemeral Kubernetes sandbox tests",
    "hitl: human-in-the-loop interaction tests",
    "timeout: test timeout in seconds",
]

[tool.uv.sources]
a2ui-agent = { path = "a2ui_extenstion", editable = true }
# talkops-opentelemetry-mcp-server = { path = "../talkops-mcp/src/opentelemetry-mcp-server", editable = true }
# talkops-prometheus-mcp-server = { path = "../talkops-mcp/src/prometheus-mcp-server", editable = true }
# talkops-alertmanager-mcp-server = { path = "../talkops-mcp/src/alertmanager-mcp-server", editable = true }
# talkops-loki-mcp-server = { path = "../talkops-mcp/src/loki-mcp-server", editable = true }
# talkops-tempo-mcp-server = { path = "../talkops-mcp/src/tempo-mcp-server", editable = true }
# talkops-helm-mcp-server = { path = "../talkops-mcp/src/helm-mcp-server", editable = true }
# talkops-argocd-mcp-server = { path = "../talkops-mcp/src/argocd-mcp-server", editable = true }
# talkops-argo-rollout-mcp-server = { path = "../talkops-mcp/src/argo-rollout-mcp-server", editable = true }
# talkops-traefik-mcp-server = { path = "../talkops-mcp/src/traefik-mcp-server", editable = true }

[tool.pyrefly]
python_interpreter = ".venv/bin/python"
replace-untyped-imports-with-any = true

[tool.pyrefly.errors]
missing-import = "ignore"

[tool.pyright]
reportMissingImports = false
