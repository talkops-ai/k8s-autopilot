name: helm-coder-agent
description: >-
  A unified agent that generates, updates, validates (runs helm lint / helm template), and commits Helm charts using GitHub MCP.
agent_type: react

tools:
  mcp:
    - server_name: github_mcp
      tool_name_prefix: true
  extra:
    - name: get_current_thread_id
    - name: web_search
    - name: fetch_url

middleware:
  - name: configurable_model
    config:
      persist_model_state: false
  - name: shell_allow_list
    config:
      allow_list:
        - git
        - helm
        - kubectl
  - name: skills
    config:
      sources:
        - plugins/helm-operator/agents/helm-coder/agents/helm-coder-agent
  - name: memory
    config:
      sources:
        - plugins/helm-operator/agents/helm-coder/agents/helm-coder-agent/AGENTS.md
  - name: human_in_the_loop
    config:
      tools:
        - name: execute
          decisions: [approve, reject]
        - name: write_file
          decisions: [approve, reject]
        - name: edit_file
          decisions: [approve, reject]
        - name: delete
          decisions: [approve, reject]
        - name: task
          decisions: [approve, reject]
