name: helm-operation
description: >-
  Performs live Helm operations (install, upgrade, rollback, uninstall, search) on real clusters.
  Connects to helm_mcp_server (which provides both helm and kubernetes tools).

tools:
  mcp:
    - server_name: helm_mcp_server
      tool_name_prefix: true
  extra:
    - name: kubectl_readonly

middleware:
  - name: a2ui_buffer
  - name: skills
    config:
      sources:
        - plugins/helm-operator/agents/helm-operation
  - name: memory
    config:
      sources:
        - plugins/helm-operator/agents/helm-operation/AGENTS.md
  - name: ptc_interpreter
    config:
      allowlist:
        - read_mcp_resource
        - read_file
        - ls
        - kubernetes_get_helm_releases
        - helm_get_release_status
        - helm_get_release_history
        - helm_search_charts
        - helm_get_chart_info
        - helm_get_installation_plan
        - helm_dry_run_install
        - kubectl_readonly
  - name: human_in_the_loop
    config:
      tools:
        - name: helm_install_chart
          decisions: [approve, edit, reject]
        - name: helm_upgrade_release
          decisions: [approve, edit, reject]
        - name: helm_rollback_release
          decisions: [approve, reject]
        - name: helm_uninstall_release
          decisions: [approve, reject]
