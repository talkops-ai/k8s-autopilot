services:
  postgres:
    image: postgres:latest
    container_name: k8s-autopilot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=k8s_autopilot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-TalkOpsAutopilot2026SecureDB}
      - POSTGRES_DB=k8s_autopilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k8s_autopilot -d k8s_autopilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - k8s-autopilot-net

  k8s-autopilot:
    image: talkopsai/k8s-autopilot:latest
    container_name: k8s-autopilot
    ports:
      - "10102:10102"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_URI=${POSTGRES_URI:-postgresql://k8s_autopilot:${POSTGRES_PASSWORD:-TalkOpsAutopilot2026SecureDB}@postgres:5432/k8s_autopilot?sslmode=disable}
      - KUBECONFIG=/app/.kube/config
    volumes:
      # Mount your kubeconfig so the server can access your cluster
      - ${HOME}/.kube/config:/app/.kube/config:ro
    restart: unless-stopped
    networks:
      - k8s-autopilot-net

  talkops-ui:
    image: talkopsai/talkops:latest
    container_name: talkops-ui
    environment:
      - K8S_AGENT_URL=http://localhost:10102
      - TALKOPS_ENABLE_LOGGING=false
      - TALKOPS_V2_STREAM_DEBUG=false
      - VITE_ENVIRONMENT=production
    ports:
      - "8888:80"
    depends_on:
      - k8s-autopilot
    restart: unless-stopped
    networks:
      - k8s-autopilot-net

networks:
  k8s-autopilot-net:
    driver: bridge

volumes:
  postgres_data:
